spring.application.name=hireflow-backend

# ------------------------------------
# SERVER CONFIG
# ------------------------------------
server.port=8080
server.servlet.context-path=/api/v1

# ------------------------------------
# DATABASE CONFIG
# ------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hireflow_db
spring.datasource.username=root
spring.datasource.password=Chaitanya@26
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ------------------------------------
# JPA / HIBERNATE CONFIG
# ------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------
# CONNECTION POOL (HikariCP)
# ------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------
# SWAGGER / OPENAPI
# ------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ------------------------------------
# FILE UPLOAD CONFIG (for future resume upload)
# ------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------
# LOGGING
# ------------------------------------
logging.level.org.springframework=INFO
logging.level.com.hireflow=DEBUG



